<!doctype html>
<html>
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Chess</title>
        <link rel="icon" href="favicon.svg" type="image/x-icon" />
        <link rel="stylesheet"

                background: #4c525f;

                width: 70vw;
                max-width: 700px;
